name: Android Build

# The developer has no local PC/Android Studio/SDK/emulator, so this
# workflow IS the build environment. It runs on every push/PR and can also
# be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK + checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest runners already ship a preinstalled Android SDK
      # (ANDROID_HOME / ANDROID_SDK_ROOT set, build-tools 36.x present) with
      # licenses pre-accepted, so no separate "setup-android" action is
      # needed for a compileSdk 36 project. If a future compileSdk bump
      # needs a platform the image doesn't have yet, AGP will download it
      # automatically over the network available to this runner.

      # This project has no committed Gradle Wrapper: generating the
      # wrapper's binary launcher jar isn't possible in the sandboxed
      # environment this project was authored in. setup-gradle installs a
      # pinned Gradle distribution directly instead and exposes it as
      # `gradle` on PATH - functionally equivalent for CI purposes, with the
      # added benefit of gradle/actions' dependency caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-read-only: false

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: timetrace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
